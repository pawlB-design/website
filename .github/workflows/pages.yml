name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: '0.22.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Zola
        shell: bash
        run: |
          set -euo pipefail
          archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          mkdir -p "${RUNNER_TEMP}/zola-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/zola-bin" zola
          echo "${RUNNER_TEMP}/zola-bin" >> "$GITHUB_PATH"

      - name: Check site
        run: zola check --skip-external-links

      - name: Build for the configured Pages URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: zola build --base-url "$PAGES_BASE_URL"

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
